name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag is not vX.Y.Z"; exit 1; }
          grep -q "version = \"$version\"" pyproject.toml || { echo "pyproject.toml version != $version"; exit 1; }
          {
            echo "list<<EOF"
            echo "ghcr.io/flyingnobita/pushover-desktop-client:$version"
            echo "ghcr.io/flyingnobita/pushover-desktop-client:${version%.*}"
            echo "ghcr.io/flyingnobita/pushover-desktop-client:latest"
            echo "ghcr.io/flyingnobita/pushover-desktop-client:sha-${GITHUB_SHA:0:12}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pdc-smoke:ci

      - name: Smoke test /healthz
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e AUTH_DISABLED=true -e COLLECTOR_BACKEND=stub pdc-smoke:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -Eq '"status" *: *"ok"'
          docker rm -f smoke

      - name: Build and push both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.tags.outputs.list }}

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed version tag and smoke /healthz
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker pull "ghcr.io/flyingnobita/pushover-desktop-client:$version"
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e AUTH_DISABLED=true -e COLLECTOR_BACKEND=stub "ghcr.io/flyingnobita/pushover-desktop-client:$version"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -Eq '"status" *: *"ok"'
          docker rm -f smoke

      - name: Assert the four tags share one digest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base=ghcr.io/flyingnobita/pushover-desktop-client
          expected=$(docker buildx imagetools inspect "$base:$version" --format '{{.Manifest.Digest}}')
          for t in "$version" "${version%.*}" latest "sha-${GITHUB_SHA:0:12}"; do
            got=$(docker buildx imagetools inspect "$base:$t" --format '{{.Manifest.Digest}}')
            [ "$got" = "$expected" ] || { echo "$t: $got != $expected"; exit 1; }
          done
          echo "all four tags resolve to $expected"
